# One index, one data class: synthetic mine operations events.
# 14 days of ticks plus slack. A size-based roll can freeze data sooner than
# this setting, so check the oldest event after backfill.
[kiruna_events]
homePath = $SPLUNK_DB/kiruna_events/db
coldPath = $SPLUNK_DB/kiruna_events/colddb
thawedPath = $SPLUNK_DB/kiruna_events/thaweddb
frozenTimePeriodInDays = 21
