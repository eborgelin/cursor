# Report contracts. Owner nobody (metadata/default.meta). No email, webhook, or alert action.
# Cron runs in the server timezone; set the host to Europe/Stockholm.

[kiruna_refresh_summaries]
description = What is the latest asset, level, flow, and service state? The only search that scans recent asset and flow events for the wall displays. Writes kiruna_asset_latest, kiruna_level_status, kiruna_flow_latest, kiruna_service_scores.
enableSched = 1
cron_schedule = * * * * *
schedule_window = 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
dispatch.ttl = 120
is_visible = 1
alert.track = 0
search = `kiruna_events` (sourcetype="kiruna:asset" OR sourcetype="kiruna:flow") earliest=-5m latest=now \
| eval key=coalesce(asset_id, object_id) \
| fields _time sourcetype key asset_type fleet level_m place_id state autonomy_mode cause activity alarm_code alarm_severity speed_kmh payload_t scenario object_type inflow_tpm level_pct feed_tpm feed_floor_tpm buffer_min buffer_t hoist_tpm plan_tpm status plant_feed_risk shift_start shift_drawn_t shift_hoisted_t shift_crushed_t producing presentation_shift \
| stats latest(*) as * max(_time) as last_seen by sourcetype key \
| eval status_code=case(sourcetype="kiruna:asset" AND state="down", 3, alarm_severity>=3, 3, sourcetype="kiruna:flow" AND status="down", 3, sourcetype="kiruna:asset" AND (state="stuck" OR state="stopped"), 2, alarm_severity=2, 2, true(), 1) \
| appendpipe [ where sourcetype="kiruna:asset" \
  | rename key as asset_id \
  | lookup kiruna_assets asset_id OUTPUT label hero pass_id \
  | eval status=case(status_code=3, "Critical", status_code=2, "Warning", true(), "Healthy") \
  | table asset_id label asset_type fleet level_m place_id pass_id state activity autonomy_mode cause alarm_code alarm_severity speed_kmh payload_t status_code status hero scenario last_seen \
  | outputlookup override_if_empty=false kiruna_asset_latest \
  | where 1=2 ] \
| appendpipe [ stats max(status_code) as live_code by level_m \
  | inputlookup append=true kiruna_levels \
  | eventstats max(live_code) as live_code by level_m \
  | eventstats count(live_code) as have_live \
  | where have_live>0 AND isnotnull(svg_region_id) \
  | eval status_code=if(live=1, coalesce(live_code, 1), 0) \
  | eval status=case(status_code=3, "Critical", status_code=2, "Warning", status_code=1, "Healthy", true(), "No demo fleet") \
  | table svg_region_id level_m role label status_code status \
  | outputlookup override_if_empty=false kiruna_level_status \
  | where 1=2 ] \
| appendpipe [ where sourcetype="kiruna:flow" \
  | rename key as object_id \
  | table object_id object_type level_m inflow_tpm level_pct feed_tpm feed_floor_tpm buffer_min buffer_t hoist_tpm plan_tpm status plant_feed_risk shift_start shift_drawn_t shift_hoisted_t shift_crushed_t producing presentation_shift alarm_code alarm_severity status_code scenario last_seen \
  | outputlookup override_if_empty=false kiruna_flow_latest \
  | where 1=2 ] \
| appendpipe [ stats count as n \
    count(eval(sourcetype="kiruna:asset" AND asset_type="lhd" AND (state="stopped" OR state="down"))) as lhd_stopped \
    count(eval(sourcetype="kiruna:asset" AND asset_type="truck" AND state="stuck")) as trucks_stuck \
    count(eval(sourcetype="kiruna:asset" AND autonomy_mode="failsafe_stop")) as failsafe \
    count(eval(sourcetype="kiruna:flow" AND object_type="crusher" AND feed_tpm<feed_floor_tpm)) as crushers_low \
    min(eval(if(sourcetype="kiruna:flow" AND object_type="buffer", buffer_min, null()))) as buffer_min \
    max(eval(if(sourcetype="kiruna:flow" AND key="KIR-HST-01" AND plan_tpm>0, hoist_tpm/plan_tpm, null()))) as hoist_ratio \
    count(eval(sourcetype="kiruna:flow" AND object_type="comms_zone" AND status="down")) as zones_down \
    max(eval(if(sourcetype="kiruna:flow" AND key="KIR-CNV-01", plant_feed_risk, null()))) as plant_feed_risk \
    max(last_seen) as last_seen \
    first(scenario) as scenario \
  | where n>0 \
  | eval score_draw=max(0, 100-30*lhd_stopped) \
  | eval score_haulage=case(trucks_stuck=0, 100, trucks_stuck=1, 60, true(), 30) \
  | eval score_crushing=max(0, 100-40*crushers_low) \
  | eval score_hoisting=case(isnull(buffer_min), 100, buffer_min>=30, 100, buffer_min>=15, 70, true(), 40) \
  | eval score_hoisting=if(isnotnull(hoist_ratio) AND hoist_ratio<0.5, min(score_hoisting, 40), score_hoisting) \
  | eval score_autonomy=max(0, case(zones_down=0, 100, zones_down=1, 50, true(), 20) - 15*failsafe) \
  | eval score_outbound=if(plant_feed_risk=1, 60, 100) \
  | eval haulage_for_parent=if(score_haulage<50, score_haulage, max(score_haulage, 80)) \
  | eval score_parent=min(score_draw, score_crushing, score_hoisting, score_autonomy, haulage_for_parent) \
  | eval buf_txt=coalesce(tostring(round(buffer_min, 0)), "n/a"), hoist_txt=coalesce(tostring(round(hoist_ratio*100, 0)), "n/a") \
  | eval rows=mvappend("kiruna_production|Kiruna production|0|".score_parent."|Minimum of draw, crushing, hoisting, and autonomy. One stuck truck alone does not pull production down.|shift_brief", "draw_load|Draw and load|1|".score_draw."|".lhd_stopped." production LHD stopped|level_ops", "level_haulage|Level haulage|2|".score_haulage."|".trucks_stuck." truck stuck on a shared drift|mine_section", "crushing|Crushing|3|".score_crushing."|".crushers_low." crusher below feed floor|stuck_recovery", "hoisting|Hoisting|4|".score_hoisting."|Buffer ".buf_txt." min, main hoist at ".hoist_txt." pct of plan|stuck_recovery", "autonomy_comms|Autonomy and comms|5|".score_autonomy."|".zones_down." comms zone down, ".failsafe." asset in failsafe stop|mine_section", "outbound|Outbound logistics|6|".score_outbound."|".if(plant_feed_risk=1, "Plant feed at risk. Lagged; not in the parent minimum.", "Plant feed normal")."|outbound_overview") \
  | eval summary_time=now() \
  | fields rows scenario summary_time last_seen \
  | mvexpand rows \
  | rex field=rows "^(?<service_id>[^|]+)\|(?<service>[^|]+)\|(?<service_order>\d+)\|(?<score>\d+)\|(?<reason>[^|]*)\|(?<drilldown_view>[^|]+)$" \
  | eval band=case(score>=80, "Healthy", score>=50, "Warning", true(), "Critical"), color_rank=case(band="Critical", 1, band="Warning", 2, true(), 3) \
  | table service_order service_id service score band color_rank reason drilldown_view scenario summary_time last_seen \
  | outputlookup override_if_empty=false kiruna_service_scores ] \
| where isnotnull(service_id)

[kiruna_daily_rollup]
description = What were yesterday's illustrative tonnes? Rebuilds kiruna_daily_summary: indexed days from the last 13 days, plus seeded illustrative rows from 1 January for year-to-date. Also dispatched by the generator after a backfill.
enableSched = 1
cron_schedule = 15 0 * * *
schedule_window = 30
dispatch.earliest_time = -13d@d
dispatch.latest_time = @d
is_visible = 1
alert.track = 0
search = `kiruna_events` ((sourcetype="kiruna:flow" (object_type="ore_pass" OR object_type="crusher" OR object_id="KIR-HST-01")) OR (sourcetype="kiruna:supply" record="rail_departure") OR sourcetype="kiruna:quality") earliest=-13d@d latest=@d \
| bin _time span=1d \
| stats sum(eval(if(object_type="ore_pass", inflow_t, 0))) as drawn_t sum(crushed_t) as crushed_t sum(eval(if(object_id="KIR-HST-01", hoisted_t, 0))) as hoisted_t sum(eval(if(record="rail_departure", tonnes, 0))) as railed_t sum(eval(if(destination="Narvik", tonnes, 0))) as narvik_t sum(eval(if(destination="Luleå", tonnes, 0))) as lulea_t sum(eval(if(record="rail_departure", on_plan, 0))) as departures_on_plan count(eval(record="rail_departure")) as departures avg(fe_pct) as fe_pct avg(sio2_pct) as sio2_pct avg(p_pct) as p_pct by _time \
| eval source_kind="indexed" \
| append [| makeresults count=366 \
  | streamstats count as n \
  | eval _time=relative_time(now(), "@y") + (n-1)*86400 \
  | where _time < relative_time(now(), "-13d@d") \
  | eval f=0.95 + 0.07*((n*37)%11)/10, drawn_t=round(16000*f, 0), crushed_t=drawn_t, hoisted_t=round(drawn_t*0.995, 0), railed_t=round(hoisted_t*0.98, 0), narvik_t=round(railed_t*0.7, 0), lulea_t=railed_t-narvik_t, departures=12, departures_on_plan=10 + (n%3), fe_pct=67 + (((n*13)%9) - 4)/10, sio2_pct=0.8 + ((n*7)%5)/10, p_pct=0.02 + ((n*3)%7)/500, source_kind="seeded" \
  | fields - n f] \
| where _time >= relative_time(now(), "-1y@d") \
| eval day=strftime(_time, "%Y-%m-%d"), day_epoch=_time, day_plan_t=16000, year=strftime(_time, "%Y") \
| sort 0 day_epoch \
| streamstats sum(hoisted_t) as ytd_hoisted_t sum(day_plan_t) as ytd_plan_t by year \
| eval sio2_over=if(sio2_pct>1.2, 1, 0), p_over=if(p_pct>0.035, 1, 0) \
| table day day_epoch source_kind drawn_t crushed_t hoisted_t railed_t narvik_t lulea_t departures departures_on_plan fe_pct sio2_pct p_pct sio2_over p_over day_plan_t ytd_hoisted_t ytd_plan_t \
| outputlookup kiruna_daily_summary
