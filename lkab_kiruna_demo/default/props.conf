# Single-line JSON from the kiruna_demo_gen modular input. The input sets _time,
# so timestamp extraction is off. Search-time JSON fields are the contract; no EXTRACT, no CIM.

[kiruna:asset]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
DATETIME_CONFIG = NONE
TRUNCATE = 20000
category = Custom
description = Kiirunavaara demo, synthetic asset events

